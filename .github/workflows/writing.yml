name: writing

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.sushilk.tech/feed.xml"
          max_post_count: 3
          template: "$newline- `$date` [$title]($url)"
          date_format: "UTC:yyyy-mm-dd"
          commit_message: "docs: update the writing list"
          committer_username: "Sushil Kumar"
          committer_email: "sushil.dev.in@gmail.com"
